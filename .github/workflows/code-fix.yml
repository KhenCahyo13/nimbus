name: fix-code-issues

on:
  push:
    branches: [ base ]
  pull_request:

permissions:
  contents: write

jobs:
  style-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Apply Code Fixes

    steps:
      - name: Checkout code
        if: ${{ !env.ACT }}
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.CI_TOKEN || github.token }}

      - name: Check for changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            fixable:
              - '**.php'
              - '**.js'
              - '**.vue'
              - '**.ts'
              - 'package.json'
              - 'composer.json'

      - name: Setup Node.js
        if: steps.filter.outputs.fixable == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install npm dependencies
        if: steps.filter.outputs.fixable == 'true'
        run: npm ci

      - name: Fix js styles if Eslint passes
        if: steps.filter.outputs.fixable == 'true'
        run: npm run style:fix

      - name: Commit changes
        if: steps.filter.outputs.fixable == 'true' && !env.ACT && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: apply TS style fixes"

      - name: Setup PHP
        if: steps.filter.outputs.fixable == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install composer dependencies
        if: steps.filter.outputs.fixable == 'true'
        uses: ramsey/composer-install@v3

      - name: Rector
        if: steps.filter.outputs.fixable == 'true'
        run: composer rector

      - name: Commit changes
        if: steps.filter.outputs.fixable == 'true' && !env.ACT && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "refactor: apply rector"

      - name: Fix php styles
        if: steps.filter.outputs.fixable == 'true'
        run: composer style:fix

      - name: Commit changes
        if: steps.filter.outputs.fixable == 'true' && !env.ACT && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: apply php style fixes"

      - name: Fail if fixes could not be auto-applied
        if: steps.filter.outputs.fixable == 'true' && !env.ACT && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Code fixers produced changes, but this pull request comes from a fork so auto-commit is not allowed."
            echo "Please apply the generated fixes locally and push them to the PR branch."
            exit 1
          fi
